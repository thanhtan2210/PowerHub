server {
  listen 8080;
  server_tokens off;
  root /usr/share/nginx/html;

  # Applied to every response. Scripts, styles, and API calls are same-origin only (NFR-SEC-029).
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  # One-time proofs arrive in the query string; never forward them to another origin.
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Cache-Control "no-cache" always;

  location /assets/ {
    # Vite emits content-hashed file names, so these never change.
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  location = /healthz {
    access_log off;
    return 200 "ok";
  }

  location / {
    try_files $uri /index.html;
  }
}
