# Only public route families are listed. /health/*, /internal/*, and /openapi are never
# exposed (NFR-SEC-019). The ingress class, host, and TLS secret are set per overlay.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: powerhub
spec:
  rules:
    - host: powerhub.invalid
      http:
        paths:
          - path: /api/v1/auth
            pathType: Prefix
            backend: { service: { name: identity, port: { name: http } } }
          - path: /api/v1/users
            pathType: Prefix
            backend: { service: { name: identity, port: { name: http } } }
          - path: /api/v1/devices
            pathType: Prefix
            backend: { service: { name: device, port: { name: http } } }
          - path: /.well-known/jwks.json
            pathType: Exact
            backend: { service: { name: identity, port: { name: http } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: frontend, port: { name: http } } }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
# Web-facing pods accept traffic only from the ingress controller namespace, which each
# overlay labels with powerhub.io/ingress=true.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-ingress
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [identity, device, frontend]
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              powerhub.io/ingress: "true"
      ports:
        - { protocol: TCP, port: 8080 }
---
# Services verify tokens with Identity's public keys, fetched over the cluster network.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: identity-jwks-from-services
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: identity
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: device
      ports:
        - { protocol: TCP, port: 8080 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: device-egress
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [device, device-migrate]
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: identity
      ports:
        - { protocol: TCP, port: 8080 }
    - ports:
        - { protocol: TCP, port: 5432 }
        - { protocol: TCP, port: 4317 }
---
# The MQTT broker asks Device Service to authenticate devices and authorise topics
# (ADR 0013). No broker manifest exists yet: where it runs in staging and production is an
# open decision. Whatever runs it must carry this label, in this namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: device-from-mqtt-broker
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: device
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mqtt-broker
      ports:
        - { protocol: TCP, port: 8080 }
---
# Identity reaches managed PostgreSQL, SMTP submission, and the OTLP collector. Overlays
# should narrow the destination to the provider's address range once it is chosen.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: identity-egress
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [identity, identity-migrate]
  policyTypes: [Egress]
  egress:
    - ports:
        - { protocol: TCP, port: 5432 }
        - { protocol: TCP, port: 587 }
        - { protocol: TCP, port: 4317 }
