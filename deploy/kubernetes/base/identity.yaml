apiVersion: v1
kind: ServiceAccount
metadata:
  name: identity
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: identity-config
data:
  ASPNETCORE_HTTP_PORTS: "8080"
  # Trust X-Forwarded-* so rate limits and audit records see the real client address.
  # Safe only because NetworkPolicy admits traffic solely from the ingress controller.
  ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
  Jwt__SigningKeyPath: /var/run/secrets/powerhub/signing/current.pem
  # Overlays set Jwt__Issuer and Email__FrontendBaseUrl to the public origin.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: identity
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: identity
    spec:
      serviceAccountName: identity
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: identity
          image: powerhub/identity
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: identity-config
          env:
            - name: ConnectionStrings__IdentityDb
              valueFrom:
                secretKeyRef:
                  name: identity-secrets
                  key: runtime-connection-string
            - name: Email__Password
              valueFrom:
                secretKeyRef:
                  name: identity-secrets
                  key: smtp-password
                  optional: true
          volumeMounts:
            - name: signing-key
              mountPath: /var/run/secrets/powerhub/signing
              readOnly: true
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet: { path: /health/startup, port: http }
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { cpu: "1", memory: 384Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: signing-key
          secret:
            secretName: identity-signing-key
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: identity
spec:
  selector:
    app.kubernetes.io/name: identity
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: identity
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: identity
---
# Runs before each rollout with the schema-owning credential; serving pods never migrate
# (INF-MIG-001, INF-MIG-002). A Job is immutable, so the release step deletes the previous
# one before applying. See deploy/kubernetes/README.md.
apiVersion: batch/v1
kind: Job
metadata:
  name: identity-migrate
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: identity-migrate
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: powerhub/identity
          args: ["migrate"]
          env:
            - name: ConnectionStrings__IdentityDb
              valueFrom:
                secretKeyRef:
                  name: identity-secrets
                  key: migrator-connection-string
            - name: Jwt__Issuer
              value: https://not-used-by-migration.invalid
            - name: Email__FrontendBaseUrl
              value: https://not-used-by-migration.invalid
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { cpu: "1", memory: 384Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
