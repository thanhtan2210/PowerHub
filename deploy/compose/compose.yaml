# Local PowerHub environment (INF-LOCAL-001).
#   cp .env.example .env
#   docker compose up --build
# The database init script runs only on a new volume. After pulling a change that adds a
# service database, recreate it once with: docker compose down -v
# Web application: http://localhost:8080   Captured email: http://localhost:8025
# MQTT broker:     localhost:1883 (username = device id, password = device credential)
name: powerhub

services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
      IDENTITY_MIGRATOR_PASSWORD: ${IDENTITY_MIGRATOR_PASSWORD}
      IDENTITY_SVC_PASSWORD: ${IDENTITY_SVC_PASSWORD}
      DEVICE_MIGRATOR_PASSWORD: ${DEVICE_MIGRATOR_PASSWORD}
      DEVICE_SVC_PASSWORD: ${DEVICE_SVC_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../postgres/bootstrap.sh:/docker-entrypoint-initdb.d/bootstrap.sh:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d device_db"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Captures outbound email locally; nothing is delivered to real mailboxes.
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"

  identity-migrate:
    build: &identity-build
      context: ../..
      dockerfile: src/services/identity/Dockerfile
    command: ["migrate"]
    environment:
      ConnectionStrings__IdentityDb: Host=postgres;Database=identity_db;Username=identity_migrator;Password=${IDENTITY_MIGRATOR_PASSWORD}
      Jwt__Issuer: http://localhost:${GATEWAY_PORT:-8080}
      Email__FrontendBaseUrl: http://localhost:${GATEWAY_PORT:-8080}
      ASPNETCORE_ENVIRONMENT: Development
    depends_on:
      postgres:
        condition: service_healthy

  identity:
    build: *identity-build
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      ConnectionStrings__IdentityDb: Host=postgres;Database=identity_db;Username=identity_svc;Password=${IDENTITY_SVC_PASSWORD}
      Jwt__Issuer: http://localhost:${GATEWAY_PORT:-8080}
      Session__CookieSecure: "false"
      Email__Host: mailpit
      Email__Port: "1025"
      Email__UseStartTls: "false"
      Email__FrontendBaseUrl: http://localhost:${GATEWAY_PORT:-8080}
    ports:
      - "127.0.0.1:5080:8080"
    depends_on:
      identity-migrate:
        condition: service_completed_successfully

  device-migrate:
    build: &device-build
      context: ../..
      dockerfile: src/services/device/Dockerfile
    command: ["migrate"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DeviceDb: Host=postgres;Database=device_db;Username=device_migrator;Password=${DEVICE_MIGRATOR_PASSWORD}
      Auth__JwksUrl: http://identity:8080/.well-known/jwks.json
      Auth__Issuer: http://localhost:${GATEWAY_PORT:-8080}
    depends_on:
      postgres:
        condition: service_healthy

  device:
    build: *device-build
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      ConnectionStrings__DeviceDb: Host=postgres;Database=device_db;Username=device_svc;Password=${DEVICE_SVC_PASSWORD}
      # Keys are fetched from Identity inside the Compose network, never through the gateway.
      Auth__JwksUrl: http://identity:8080/.well-known/jwks.json
      Auth__Issuer: http://localhost:${GATEWAY_PORT:-8080}
    ports:
      - "127.0.0.1:5081:8080"
    depends_on:
      device-migrate:
        condition: service_completed_successfully
      identity:
        condition: service_started

  # MQTT is the device-facing protocol only. The broker holds no credentials: it asks
  # Device Service to authenticate each connection and authorise each topic (ADR 0013).
  mqtt:
    image: iegomez/mosquitto-go-auth:3.0.0-mosquitto_2.0.18
    volumes:
      - ./mosquitto/mosquitto.conf:/etc/mosquitto/mosquitto.conf:ro
    ports:
      - "127.0.0.1:1883:1883"
    depends_on:
      device:
        condition: service_started

  frontend:
    build:
      context: ../../src/frontend

  gateway:
    image: nginxinc/nginx-unprivileged:1.29-alpine
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:8080"
    depends_on:
      - identity
      - device
      - frontend

volumes:
  postgres-data:
