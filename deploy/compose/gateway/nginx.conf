# Local stand-in for the Kubernetes Ingress: one origin for the web application and the
# public API routes. Internal and health endpoints are deliberately not routed.
server {
  listen 8080;
  server_tokens off;

  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;

  location /api/v1/auth/  { proxy_pass http://identity:8080; }
  location /api/v1/users  { proxy_pass http://identity:8080; }
  location = /.well-known/jwks.json { proxy_pass http://identity:8080; }

  location / { proxy_pass http://frontend:8080; }
}
