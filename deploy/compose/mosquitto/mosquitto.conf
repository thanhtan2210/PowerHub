# Local MQTT broker (ADR 0013). Plain MQTT on 1883 is for isolated local use only;
# staging and production require TLS.
listener 1883
allow_anonymous false
persistence false
log_dest stdout
log_type error
log_type warning
log_type notice

# Bound what one client can send before a consuming service validates content.
message_size_limit 16384
max_inflight_messages 20

# Every connection and topic decision is delegated to Device Service, which owns device
# credentials. The broker stores no credentials of its own.
auth_plugin /mosquitto/go-auth.so
auth_opt_backends http
auth_opt_http_host device
auth_opt_http_port 8080
auth_opt_http_getuser_uri /internal/v1/mqtt/auth
auth_opt_http_superuser_uri /internal/v1/mqtt/superuser
auth_opt_http_aclcheck_uri /internal/v1/mqtt/acl
auth_opt_http_params_mode json
auth_opt_http_response_mode status
auth_opt_http_timeout 5
auth_opt_log_level info

# Decisions are cached briefly to keep Device Service off the per-message path. This is
# also the longest a rotated or removed credential can keep working for new connections.
auth_opt_cache true
auth_opt_cache_type go-cache
auth_opt_cache_reset true
auth_opt_auth_cache_seconds 30
auth_opt_acl_cache_seconds 30
